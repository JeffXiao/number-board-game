<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Math Crossword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/home.css" />
  </head>
  <body>
    
    <!-- main menu page (the Daily / Practice landing page) -->
<section id="viewMain">
      <main class="home-wrap">
        <!-- language and sound live on the landing page (moved
             here from the game page's top bar at the user's
             request); main.js wires them by id, exactly as before -->
        <div class="home-tools">
          <div class="lang-wrap">
            <button class="btn lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="语言 / Language" title="语言 / Language">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#globe"></use></svg>
              <span class="lang-code" id="langCode">EN</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu" aria-label="Language / 语言">
              <button type="button" role="menuitemradio" data-lang="en" aria-checked="true"><span>English</span><span class="check" aria-hidden="true">✓</span></button>
              <button type="button" role="menuitemradio" data-lang="zh" aria-checked="false"><span>中文</span><span class="check" aria-hidden="true">✓</span></button>
            </div>
          </div>
          <button class="btn sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Turn off the placement sound" title="Turn off the placement sound">
            <svg class="icon-sound-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#sound-on"></use></svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#sound-off"></use></svg>
          </button>
        </div>

        <!-- the heading shows the game's name in the selected
             language only — never both at once; main.js and
             view.js keep #homeTitle in step with the language -->
        <header class="home-head">
          <h1 id="homeTitle">Math Crossword</h1>
        </header>

        <nav class="menu-list" id="menuList" aria-label="Choose a mode">
          <a class="menu-card" href="calendar.html">
            <span class="menu-icon daily">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#calendar"></use></svg>
            </span>
            <span class="menu-text">
              <span class="menu-label" id="menuDailyLabel">Daily</span>
              <span class="menu-desc" id="menuDailyDesc">One puzzle a day, on the calendar</span>
            </span>
            <svg class="menu-arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#back"></use></svg>
          </a>

          <a class="menu-card" href="game.html">
            <span class="menu-icon main">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#grid"></use></svg>
            </span>
            <span class="menu-text">
              <span class="menu-label" id="menuMainLabel">Practice</span>
              <span class="menu-desc" id="menuMainDesc">Play anytime, any difficulty</span>
            </span>
            <svg class="menu-arrow" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#back"></use></svg>
          </a>
        </nav>

        <!-- register: a player name kept on this device only.
             The button sits at the bottom of the landing page;
             tapping it opens the popup below, where the player
             enters a name. main.js wires it to MC.Player, which
             stores the names in localStorage and refuses a name
             that is already registered. Once a name is registered
             the user is recognized, so the button is hidden and
             only the names list below remains. -->
        <div class="register-area">
          <button class="btn register-btn" id="registerBtn" type="button" aria-haspopup="dialog">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><use href="assets/icons/sprite.svg#person"></use></svg>
            <span id="registerBtnLabel">Register</span>
          </button>
          <p class="player-list hidden" id="playerList"></p>
        </div>
      </main>

      <!-- register popup: the name is entered here; a name that
           is already registered shows its error inside this
           popup (in #registerError) and nothing is saved -->
      <div class="register-overlay" id="registerOverlay">
        <div class="register-dialog" role="dialog" aria-modal="true" aria-labelledby="registerTitle">
          <h2 id="registerTitle">Register</h2>
          <form id="registerForm" novalidate>
            <label class="register-label" id="registerNameLabel" for="playerNameInput">Player name</label>
            <input class="register-input" id="playerNameInput" type="text" maxlength="24" autocomplete="off" autocapitalize="words" placeholder="Your name" aria-describedby="registerError" />
            <p class="register-error hidden" id="registerError" role="alert"></p>
            <p class="register-hint" id="registerHint">Kept on this device only.</p>
            <div class="register-actions">
              <button class="btn" id="registerCancelBtn" type="button">Cancel</button>
              <button class="btn primary" id="registerSaveBtn" type="submit">Save</button>
            </div>
          </form>
        </div>
      </div>
    </section>

    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/player.js"></script>
    <script src="js/audio.js"></script>
    <!-- Landing wiring (the menu page's own script): the shared
         main.js cannot load here — it wires game controls that do
         not exist on this page. This mirrors its landing section:
         language menu, sound switch, and the heading / card labels
         in the stored language from the first paint. -->
    <script>
    (function (global) {
      "use strict";
      var MC = global.MC || (global.MC = {});
      var i18n = MC.i18n;
      var audio = MC.audio;
      function element(id) { return document.getElementById(id); }
      var langButton = element("langBtn");
      var langMenu = element("langMenu");
      var soundButton = element("soundBtn");
      function syncLanding() {
        document.title = i18n.translate("title");
        document.documentElement.lang = i18n.translate("htmlLang");
        var homeTitle = element("homeTitle");
        if (homeTitle) homeTitle.textContent = i18n.translate("title");
        var setText = function (id, key) {
          var el = element(id);
          if (el) el.textContent = i18n.translate(key);
        };
        setText("menuDailyLabel", "menuDaily");
        setText("menuDailyDesc", "menuDailyDesc");
        setText("menuMainLabel", "menuMain");
        setText("menuMainDesc", "menuMainDesc");
        var menuList = element("menuList");
        if (menuList) menuList.setAttribute("aria-label", i18n.translate("menuChoose"));
        var langCode = element("langCode");
        if (langCode) langCode.textContent = i18n.translate("code");
        document.querySelectorAll("#langMenu button").forEach(function (button) {
          button.setAttribute("aria-checked", button.dataset.lang === i18n.language() ? "true" : "false");
        });
        if (soundButton) {
          var enabled = audio.isEnabled();
          soundButton.setAttribute("aria-pressed", enabled ? "true" : "false");
          var label = i18n.translate(enabled ? "soundOffLabel" : "soundOnLabel");
          soundButton.setAttribute("aria-label", label);
          soundButton.title = label;
        }
        renderRegister();
      }
      /* Register: a player name kept on this device only (mirrors
         main.js's renderRegister/openRegister/submit). Once a name
         is registered the user is recognized, so the button hides
         and only the names list below remains. A name that is
         already registered shows its error inside the popup and
         is not saved. */
      var registerOverlay = element("registerOverlay");
      var registerForm = element("registerForm");
      var playerNameInput = element("playerNameInput");
      var registerError = element("registerError");
      function showRegisterError(message) {
        if (!registerError) return;
        registerError.textContent = message;
        registerError.classList.remove("hidden");
        if (playerNameInput) playerNameInput.setAttribute("aria-invalid", "true");
      }
      function clearRegisterError() {
        if (registerError) { registerError.textContent = ""; registerError.classList.add("hidden"); }
        if (playerNameInput) playerNameInput.removeAttribute("aria-invalid");
      }
      function renderRegister() {
        var Player = MC.Player;
        var registered = Player ? Player.list() : [];
        var registerBtnEl = element("registerBtn");
        if (registerBtnEl) registerBtnEl.classList.toggle("hidden", registered.length > 0);
        var setText = function (id, key) {
          var el = element(id);
          if (el) el.textContent = i18n.translate(key);
        };
        setText("registerBtnLabel", "register");
        setText("registerTitle", "registerTitle");
        setText("registerNameLabel", "registerLabel");
        if (playerNameInput) playerNameInput.placeholder = i18n.translate("registerPlaceholder");
        setText("registerHint", "registerHint");
        setText("registerSaveBtn", "registerSave");
        setText("registerCancelBtn", "registerCancel");
        var list = element("playerList");
        if (list && Player) {
          if (registered.length) {
            list.textContent = i18n.translate("registeredPlayers") + ": " + registered.join(", ");
            list.classList.remove("hidden");
          } else {
            list.textContent = "";
            list.classList.add("hidden");
          }
        }
      }
      function openRegister() {
        if (!registerOverlay) return;
        clearRegisterError();
        if (playerNameInput) playerNameInput.value = "";
        registerOverlay.classList.add("show");
        if (playerNameInput) playerNameInput.focus();
      }
      function closeRegister() {
        if (!registerOverlay) return;
        registerOverlay.classList.remove("show");
        var btn = element("registerBtn");
        if (btn) btn.focus();
      }
      var registerBtn = element("registerBtn");
      if (registerBtn) registerBtn.addEventListener("click", openRegister);
      var registerCancelBtn = element("registerCancelBtn");
      if (registerCancelBtn) registerCancelBtn.addEventListener("click", closeRegister);
      if (registerOverlay) registerOverlay.addEventListener("click", function (event) {
        if (event.target === registerOverlay) closeRegister();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape" && registerOverlay && registerOverlay.classList.contains("show")) closeRegister();
      });
      if (playerNameInput) playerNameInput.addEventListener("input", clearRegisterError);
      if (registerForm) registerForm.addEventListener("submit", function (event) {
        event.preventDefault();
        if (!MC.Player || !playerNameInput) return;
        var name = playerNameInput.value.trim();
        if (!name) {
          showRegisterError(i18n.translate("registerEmpty"));
          playerNameInput.focus();
          return;
        }
        if (MC.Player.isTaken(name)) {
          showRegisterError(i18n.translate("registerTaken"));
          playerNameInput.focus();
          playerNameInput.select();
          return;
        }
        if (!MC.Player.add(name)) {
          showRegisterError(i18n.translate("registerTaken"));
          return;
        }
        closeRegister();
        renderRegister();
      });
      function closeLangMenu() {
        langMenu.classList.remove("show");
        langButton.setAttribute("aria-expanded", "false");
      }
      langButton.addEventListener("click", function (event) {
        event.stopPropagation();
        var open = langMenu.classList.toggle("show");
        langButton.setAttribute("aria-expanded", open ? "true" : "false");
      });
      document.querySelectorAll("#langMenu button").forEach(function (button) {
        button.addEventListener("click", function () {
          if (i18n.setLanguage(button.dataset.lang)) syncLanding();
          closeLangMenu();
        });
      });
      document.addEventListener("click", function (event) {
        if (!event.target.closest(".lang-wrap")) closeLangMenu();
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") closeLangMenu();
      });
      soundButton.addEventListener("click", function () {
        audio.toggle();
        var enabled = audio.isEnabled();
        soundButton.setAttribute("aria-pressed", enabled ? "true" : "false");
        var label = i18n.translate(enabled ? "soundOffLabel" : "soundOnLabel");
        soundButton.setAttribute("aria-label", label);
        soundButton.title = label;
      });
      syncLanding();
    })(window);
    </script>
  </body>
</html>
