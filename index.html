<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="data:," />
    <title>Math Crossword</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500&display=swap" rel="stylesheet" />
    <style>
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]) { min-height: 2rem; }

      :root {
        --bg: #f8f4ea;
        --panel: #fffdf6;
        --ink: #33302a;
        --ink-soft: #6f6a5c;
        --line: #ddd3b8;
        --given-bg: #f6dc9a;
        --given-line: #d3af55;
        --given-ink: #3d2f10;
        --op-bg: #f1cf7e;
        --blank-bg: #fffef9;
        --blank-line: #c9bd97;
        --filled-bg: #dcf2e1;
        --filled-line: #8fc7a0;
        --filled-ink: #166534;
        --accent: #d97706;
        --accent-ink: #ffffff;
        --tile-bg: #e7f6ec;
        --tile-line: #79b78d;
        --tile-ink: #14713c;
        --danger: #dc2626;
        --danger-bg: #fde8e8;
        --sort-ink: #3355c4;
        --overlay-bg: rgba(248, 244, 234, 0.97);
        --shadow: 0 10px 28px rgba(93, 74, 28, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #191a16;
          --panel: #22241e;
          --ink: #ece7d8;
          --ink-soft: #a79f8a;
          --line: #454133;
          --given-bg: #66531c;
          --given-line: #8a6f27;
          --given-ink: #ffe9a8;
          --op-bg: #59481a;
          --blank-bg: #26281f;
          --blank-line: #5b553d;
          --filled-bg: #1d4630;
          --filled-line: #2f7a4c;
          --filled-ink: #a9e6bb;
          --accent: #f59e0b;
          --accent-ink: #231a02;
          --tile-bg: #173326;
          --tile-line: #2f7a4c;
          --tile-ink: #8fe3ae;
          --danger: #f87171;
          --danger-bg: #4a1f1f;
          --sort-ink: #93aef5;
          --overlay-bg: rgba(25, 26, 22, 0.97);
          --shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        }
      }

      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .num { font-family: "Baloo 2", "PingFang SC", "Microsoft YaHei", sans-serif; }

      .wrap {
        max-width: 640px;
        margin: 0 auto;
        padding: 18px 14px 40px;
      }

      /* ---------- status bar ---------- */
      .statusbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .stats { display: flex; gap: 16px; align-items: baseline; font-size: 15px; }
      .stats .label { color: var(--ink-soft); font-size: 13px; margin-right: 4px; }
      .stats .val { font-weight: 400; font-size: 17px; }
      .stats .val.bad { color: var(--danger); }
      .actions { display: flex; gap: 8px; }
      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--panel);
        color: var(--ink);
        border-radius: 10px;
        padding: 8px 14px;
        font-size: 14px;
        font-family: inherit;
        cursor: pointer;
        min-height: 40px;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn:hover { border-color: var(--accent); }
      .btn.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-ink);
        font-weight: 400;
      }
      .actions { flex-wrap: wrap; }
      .reset-btn { color: var(--sort-ink); padding: 8px 10px; justify-content: center; }
      .reset-btn svg { width: 20px; height: 20px; display: block; flex: none; }
      .sound-btn { color: var(--sort-ink); padding: 8px 10px; justify-content: center; }
      .sound-btn svg { width: 20px; height: 20px; display: block; flex: none; }
      /* like the other icon buttons, the sound button itself never
         highlights or dims — only the glyph changes when sound is off */
      .sound-btn .icon-sound-off { display: none; }
      .sound-btn[aria-pressed="false"] .icon-sound-on { display: none; }
      .sound-btn[aria-pressed="false"] .icon-sound-off { display: block; }
      .pause-btn, .hint-btn { color: var(--sort-ink); padding: 8px 10px; justify-content: center; }
      .pause-btn svg, .hint-btn svg { width: 20px; height: 20px; display: block; flex: none; }
      .pause-btn .icon-play { display: none; }
      .pause-btn.paused .icon-pause { display: none; }
      .pause-btn.paused .icon-play { display: block; }
      /* ---------- language ---------- */
      .lang-wrap { position: relative; }
      .lang-btn { color: var(--sort-ink); padding: 8px 10px; justify-content: center; gap: 6px; }
      .lang-btn svg { width: 20px; height: 20px; display: block; flex: none; }
      .lang-btn .lang-code { font-size: 13px; line-height: 1; color: var(--ink); }
      .lang-menu {
        position: absolute;
        right: 0;
        top: calc(100% + 6px);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: var(--shadow);
        padding: 4px;
        min-width: 148px;
        z-index: 30;
        display: none;
        flex-direction: column;
        gap: 2px;
      }
      .lang-menu.show { display: flex; }
      .lang-menu button {
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--ink);
        font-family: inherit;
        font-size: 14.5px;
        text-align: left;
        padding: 9px 12px;
        border-radius: 8px;
        cursor: pointer;
        min-height: 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .lang-menu button:hover { background: var(--bg); }
      .lang-menu button[aria-checked="true"] { background: var(--given-bg); color: var(--given-ink); }
      .lang-menu button .check { visibility: hidden; font-size: 14px; }
      .lang-menu button[aria-checked="true"] .check { visibility: visible; }
      /* ---------- difficulty ---------- */
      .difficulties {
        display: flex;
        gap: 6px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 4px;
        margin-bottom: 14px;
      }
      .difficulties button {
        flex: 1;
        appearance: none;
        border: 0;
        background: transparent;
        color: var(--ink-soft);
        font-family: inherit;
        font-size: 15px;
        padding: 8px 0;
        min-height: 40px;
        border-radius: 8px;
        cursor: pointer;
      }
      .difficulties button[aria-pressed="true"] {
        background: var(--given-bg);
        color: var(--given-ink);
        font-weight: 400;
      }

      /* ---------- board ---------- */
      .board-shell {
        position: relative;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
        padding: 14px 10px;
        display: flex;
        justify-content: center;
      }
      .board {
        display: grid;
        gap: 3px;
        width: 100%;
      }
      .cell {
        aspect-ratio: 1 / 1;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 400;
        border-radius: 5px;
        line-height: 1;
        user-select: none;
        -webkit-user-select: none;
      }
      .cell.empty { visibility: hidden; }
      .cell.given {
        background: var(--given-bg);
        border: 1.5px solid var(--given-line);
        color: var(--given-ink);
      }
      .cell.op, .cell.eq {
        background: var(--op-bg);
        border: 1.5px solid var(--given-line);
        color: var(--given-ink);
        /* operators (+ − × ÷ =) render larger than the numbers so they read clearly */
        font-size: 1.38em;
        font-weight: 400;
      }
      .cell.blank {
        background: var(--blank-bg);
        border: 1.5px solid var(--blank-line);
        color: var(--filled-ink);
        cursor: pointer;
        padding: 0;
        font-family: inherit;
        width: 100%;
      }
      .cell.blank:hover { border-color: var(--accent); }
      /* no native focus ring on a cell: a fresh board shows no
         outlined cell until the player taps one to select it */
      .cell.blank:focus { outline: none; }
      .cell.blank:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
      .cell.blank.selected {
        border-color: var(--accent);
        box-shadow: 0 0 0 2.5px var(--accent);
      }
      .cell.blank.filled {
        background: var(--filled-bg);
        border-color: var(--filled-line);
        color: var(--filled-ink);
        cursor: pointer;
        /* placed numbers render at tile size so they don't shrink in the cell */
        font-size: 1.22em;
        font-weight: 400;
      }
      /* a filled number that makes its completed equation fail stays in
         place, marked red until the player takes it back or replaces it */
      .cell.blank.filled.wrong {
        background: var(--danger-bg);
        border-color: var(--danger);
        color: var(--danger);
      }
      .cell.blank.wrong-flash {
        background: var(--danger-bg);
        border-color: var(--danger);
        color: var(--danger);
      }
      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20% { transform: translateX(-4px); }
        40% { transform: translateX(4px); }
        60% { transform: translateX(-3px); }
        80% { transform: translateX(3px); }
      }
      .shake { animation: shake 0.35s ease; }
      @media (prefers-reduced-motion: reduce) {
        .shake { animation: none; }
      }

      /* ---------- overlays ---------- */
      .overlay {
        position: absolute;
        inset: 0;
        border-radius: 16px;
        background: var(--overlay-bg);
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 24px;
        z-index: 5;
      }
      .overlay.show { display: flex; }
      /* the reset confirmation sits above the pause / end overlays */
      #resetConfirmOverlay { z-index: 7; }
      .overlay h2 { margin: 0; font-size: 26px; font-weight: 400; }
      .overlay p { margin: 0; color: var(--ink-soft); font-size: 15px; line-height: 1.6; }
      .overlay .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
      .confetti-bit {
        position: absolute;
        top: -12px;
        width: 8px;
        height: 13px;
        border-radius: 2px;
        pointer-events: none;
        z-index: 6;
      }
      @keyframes fall {
        to { transform: translateY(460px) rotate(560deg); opacity: 0.15; }
      }

      /* ---------- tile bank ---------- */
      .bank-head {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 10px;
        margin: 20px 2px 10px;
      }
      .bank-head .t { font-size: 15px; font-weight: 400; }
      .bank-head .p { font-size: 13.5px; color: var(--ink-soft); }
      .bank {
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }
      .tile {
        appearance: none;
        min-width: 54px;
        height: 54px;
        padding: 0 10px;
        border-radius: 9px;
        border: 1.5px solid var(--tile-line);
        background: var(--tile-bg);
        color: var(--tile-ink);
        font-size: 24px;
        font-weight: 400;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .tile:hover { transform: translateY(-1px); }
      .tile.used { opacity: 0.18; pointer-events: none; }
      .tile.wrong-flash { background: var(--danger-bg); border-color: var(--danger); color: var(--danger); }
      .tile { touch-action: none; }
      .tile.dragging { opacity: 0.35; }
      .drag-ghost {
        position: fixed;
        z-index: 60;
        width: 54px;
        height: 54px;
        border-radius: 9px;
        border: 1.5px solid var(--tile-line);
        background: var(--tile-bg);
        color: var(--tile-ink);
        font-size: 24px;
        font-weight: 400;
        display: flex;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        transform: translate(-50%, -50%);
        box-shadow: var(--shadow);
      }
      .cell.blank.drop-target {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--accent);
        background: var(--filled-bg);
      }
      /* a filled cell can be dragged: back to the tile bank, or onto
         another blank cell to move / swap its number */
      .cell.blank.filled { cursor: grab; touch-action: none; }
      .cell.blank.dragging { opacity: 0.35; }
      .bank.return-target {
        box-shadow: 0 0 0 3px var(--accent);
        background: var(--filled-bg);
        border-radius: 12px;
      }
      .bank-tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
      .sort-btn { min-height: 34px; padding: 5px 9px; font-size: 13.5px; color: var(--sort-ink); justify-content: center; }
      .sort-btn svg { width: 19px; height: 19px; display: block; }
      .sort-btn[aria-pressed="true"] {
        background: var(--given-bg);
        border-color: var(--given-line);
        font-weight: 400;
      }
      .undo-btn { color: var(--sort-ink); }
      .undo-btn svg { width: 19px; height: 19px; display: block; flex: none; }
      .undo-btn:disabled { opacity: 0.38; cursor: default; }
      .undo-btn:disabled:hover { border-color: var(--line); }

      /* ---------- error toast ---------- */
      .toast {
        position: absolute;
        top: 10px;
        left: 50%;
        transform: translate(-50%, -8px);
        background: var(--danger);
        color: #ffffff;
        font-size: 15px;
        font-weight: 400;
        padding: 9px 18px;
        border-radius: 999px;
        box-shadow: var(--shadow);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.15s ease, transform 0.15s ease;
        z-index: 8;
        text-align: center;
        line-height: 1.4;
        max-width: calc(100% - 20px);
      }
      .toast.show { opacity: 1; transform: translate(-50%, 0); }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="statusbar">
        <div class="stats" aria-live="polite">
          <span><span class="label" id="labelMistakes">Mistakes</span><span class="val num" id="mistakes">0/3</span></span>
          <span><span class="label" id="labelTime">Time</span><span class="val num" id="timer">00:00</span></span>
          <span><span class="label" id="labelHints">Hints</span><span class="val num" id="hints">0</span></span>
        </div>
        <div class="actions">
          <div class="lang-wrap">
            <button class="btn lang-btn" id="langBtn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="语言 / Language" title="语言 / Language">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm6.93 6h-2.95a15.65 15.65 0 0 0-1.38-3.56A8.03 8.03 0 0 1 18.92 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82C10.52 6.57 11.17 5.24 12 4.04zM4.26 14C4.1 13.36 4 12.69 4 12s.1-1.36.26-2h3.38c-.08.66-.14 1.32-.14 2 0 .68.06 1.34.14 2H4.26zm.82 2h2.95c.32 1.25.78 2.45 1.38 3.56A8.03 8.03 0 0 1 5.08 16zm2.95-8H5.08a8.03 8.03 0 0 1 4.33-3.56C8.81 5.55 8.35 6.75 8.03 8zM12 19.96c-.83-1.2-1.48-2.53-1.91-3.96h3.82c-.43 1.43-1.08 2.76-1.91 3.96zm2.34-3.96c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38zm.25 3.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 0 1-4.33 3.56zM16.36 14c.08-.66.14-1.32.14-2 0-.68-.06-1.34-.14-2h3.38c.16.64.26 1.31.26 2s-.1 1.36-.26 2h-3.38z"/></svg>
              <span class="lang-code" id="langCode">EN</span>
            </button>
            <div class="lang-menu" id="langMenu" role="menu" aria-label="Language / 语言">
              <button type="button" role="menuitemradio" data-lang="en" aria-checked="true"><span>English</span><span class="check" aria-hidden="true">✓</span></button>
              <button type="button" role="menuitemradio" data-lang="zh" aria-checked="false"><span>中文</span><span class="check" aria-hidden="true">✓</span></button>
            </div>
          </div>
          <button class="btn reset-btn" id="resetBtn" type="button" aria-label="Reset this round — asks for confirmation first" title="Reset this round — asks for confirmation first">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35Z"/></svg>
          </button>
          <button class="btn sound-btn" id="soundBtn" type="button" aria-pressed="true" aria-label="Turn off the placement sound" title="Turn off the placement sound">
            <svg class="icon-sound-on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="icon-sound-off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.796 8.796 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <button class="btn pause-btn" id="pauseBtn" type="button" aria-pressed="false" aria-label="Pause" title="Pause">
            <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 5v14l11-7z"/></svg>
          </button>
          <button class="btn hint-btn" id="hintBtn" type="button" aria-label="Hint: fill in one correct number" title="Hint">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7zm2.85 11.1l-.85.6V16h-4v-2.3l-.85-.6A4.997 4.997 0 0 1 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 1.63-.8 3.16-2.15 4.1z"/></svg>
          </button>
        </div>
      </div>

      <div class="difficulties" id="diffGroup" role="group" aria-label="Difficulty">
        <button type="button" data-diff="easy" aria-pressed="false">Easy</button>
        <button type="button" data-diff="medium" aria-pressed="true">Medium</button>
        <button type="button" data-diff="hard" aria-pressed="false">Hard</button>
        <button type="button" data-diff="expert" aria-pressed="false">Expert</button>
      </div>

      <div class="board-shell" id="boardShell">
        <div class="board num" id="board" aria-label="Math crossword board"></div>
        <div class="toast" id="toast" role="alert"></div>

        <div class="overlay" id="pauseOverlay">
          <h2 id="pauseTitle">Paused</h2>
          <p id="pauseText">Take a break — continue when you’re ready.</p>
          <div class="row">
            <button class="btn primary" id="resumeBtn" type="button">Resume</button>
          </div>
        </div>

        <div class="overlay" id="endOverlay">
          <h2 id="endTitle">Done!</h2>
          <p id="endText"></p>
          <div class="row">
            <button class="btn" id="retryBtn" type="button">Try again</button>
            <button class="btn primary" id="againBtn" type="button">New puzzle</button>
          </div>
        </div>

        <div class="overlay" id="resetConfirmOverlay" role="alertdialog" aria-labelledby="resetConfirmTitle" aria-describedby="resetConfirmText">
          <h2 id="resetConfirmTitle">Reset this round?</h2>
          <p id="resetConfirmText">Resetting clears the numbers you’ve placed, and mistakes and time start over.</p>
          <div class="row">
            <button class="btn" id="resetNoBtn" type="button">No</button>
            <button class="btn primary" id="resetYesBtn" type="button">Yes</button>
          </div>
        </div>
      </div>

      <div class="bank-head">
        <span class="t" id="bankTitle">Number tiles</span>
        <span class="bank-tools">
          <span class="p" id="progress">Filled 0 / 0</span>
          <button class="btn sort-btn" id="sortBtn" type="button" aria-pressed="false" aria-label="Sort tiles from smallest to largest" title="Sort tiles from smallest to largest">

          </button>

          </button>
